[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "categoryrag"
version = "0.1.0"
description = "CategoryRAG system"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "CategoryRAG Team"}]

[tool.setuptools.packages.find]
where = ["src"]
